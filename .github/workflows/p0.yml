name: Workbench governance

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, audited 2026-10-10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, audited 2026-10-10
        with:
          python-version: '3.13.14'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_p0_api_budget.mjs tests/test_workbench_review_ui.mjs
      - run: node --check scripts/probe_deepseek_api.mjs
      - run: node --check src/workbench/web/app.js
      - run: python -m compileall -q scripts tests src
      - run: python -m compileall -q benchmarks/pi-comparison/runners
      - run: node --check benchmarks/pi-comparison/runners/resource_probe.mjs
      - run: node --check benchmarks/pi-comparison/runners/sdk_tool_probe.mjs
      - name: Parse PowerShell setup scripts without executing them
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' | ForEach-Object {
            $scriptTokens = $null
            $scriptErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$scriptTokens, [ref]$scriptErrors) | Out-Null
            if ($scriptErrors.Count) { throw ($scriptErrors.Message -join [Environment]::NewLine) }
          }
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, audited 2026-10-10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
  linux-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_p1_budget.py' -v
      - run: python -m unittest discover -s tests -p 'test_p2.py' -v
      - run: python -m unittest discover -s tests -p 'test_p3.py' -v
      - run: git config --global user.name 'Workbench CI'
      - run: git config --global user.email 'ci@example.invalid'
      - run: python -m unittest discover -s tests -p 'test_memory.py' -v
      - run: python -m unittest discover -s tests -p 'test_ui.py' -v
      - run: python -m unittest discover -s tests -p 'test_benchmark.py' -v
      - run: python -m unittest discover -s tests -p 'test_pi_comparison.py' -v
      - run: python -m unittest discover -s tests -p 'test_p6_main_budget.py' -v
      - run: python -m unittest discover -s tests -p 'test_cash*.py' -v
      - run: python -m unittest discover -s tests -p 'test_p6_main_contract.py' -v
      - run: python -m unittest discover -s tests -p 'test_p6_network_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_science.py' -v
      - run: python -m unittest discover -s tests -p 'test_publish.py' -v
      - run: python -m unittest discover -s tests -p 'test_pc*.py' -v
      - run: python -m unittest discover -s tests -p 'test_test_identities.py' -v
      - run: python -m unittest discover -s tests -p 'test_output_data.py' -v
      - run: python -m unittest discover -s tests -p 'test_trace_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_requests_local_transport.py' -v
